<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART CLASS V13</title>
<style>
body{background:#0a3d62;margin:0;padding:15px;font-family:Arial}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:10px}
.btn{background:#f1c40f;color:#0a3d62;border:none;padding:14px;width:100%;border-radius:10px;font-weight:bold;font-size:16px}
input{width:92%;padding:12px;margin:6px 0;border-radius:8px;border:2px solid #ddd}
.hidden{display:none}
.nav{display:flex;gap:5px;margin:10px 0;overflow:auto}
.nav button{padding:8px 12px;border-radius:20px;border:none;background:white;font-weight:bold;white-space:nowrap}
.nav button.active{background:#f1c40f}
.item{border-left:5px solid #27ae60;background:#eafaf1;padding:10px;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<div id="login" class="card" style="margin-top:50px;text-align:center">
<h2>🎓 SMART CLASS V13</h2>
<input id="name" placeholder="Jina - mf: Godfrey">
<input id="pass" type="password" placeholder="Password 1234 kwa Admin">
<button class="btn" onclick="ingia()">INGIA →</button>
<p style="font-size:11px;color:#888">CR weka 1234 kuona Admin</p>
</div>

<div id="main" class="hidden">
<div class="card" style="background:linear-gradient(135deg,#0a3d62,#f1c40f);color:white;text-align:center">
<h2 id="hi" style="margin:0">Habari!</h2>
<p id="leo" style="font-size:12px"></p>
<h1 id="count" style="color:#f1c40f;margin:5px">Siku 87</h1>
<button onclick="washaAlarm()" id="aBtn" style="background:white;border:none;padding:8px 15px;border-radius:20px;font-weight:bold;width:100%">🔔 Wezesha Alarm</button>
<p id="aOn" class="hidden" style="background:#27ae60;padding:5px;border-radius:5px;font-size:12px">✅ Alarm ON - Saa 1 kabla</p>
</div>

<div class="nav">
<button id="b1" class="active" onclick="tab('ratiba')">📅 Ratiba</button>
<button id="b2" onclick="tab('tangazo')">📢 Tangazo</button>
<button id="b3" onclick="tab('lib')">📚 Library</button>
<button id="b4" onclick="tab('walimu')">👨‍🏫 Walimu</button>
<button id="b5" class="hidden" onclick="tab('admin')">⚙️ Admin</button>
</div>

<div id="tRatiba" class="card"><h3>📅 Vipindi Vya Leo</h3><div id="listRatiba"></div><button class="btn" style="background:#0a3d62;color:white;margin-top:10px" onclick="nipo()">✅ NIPO DARASANI</button><p id="nipoMsg" style="color:green;text-align:center;font-weight:bold"></p></div>
<div id="tTangazo" class="card hidden"><h3>📢 Tangazo</h3><div id="listTangazo"></div><input id="tTitle" placeholder="Kichwa"><input id="tBody" placeholder="Maelezo"><button class="btn" style="background:#c0392b;color:white" onclick="addT()">+ Tuma Tangazo</button></div>
<div id="tLib" class="card hidden"><h3>📚 Library</h3><div id="listLib"></div><input id="lTitle" placeholder="Jina la kitabu"><input id="lLink" placeholder="Link ya Drive"><button class="btn" style="background:#8e44ad;color:white" onclick="addL()">+ Ongeza Kitabu</button></div>
<div id="tWalimu" class="card hidden"><h3>👨‍🏫 Walimu</h3><div id="listWalimu"></div></div>
<div id="tAdmin" class="card hidden" style="border:3px solid #f1c40f"><h3>⚙️ ADMIN - Edit</h3>
<select id="aDay" style="width:98%;padding:10px;border-radius:8px"><option value="1">Jumatatu</option><option value="2">Jumanne</option><option value="3">Jumatano</option><option value="4">Alhamisi</option><option value="5">Ijumaa</option></select>
<input id="aSomo" placeholder="Somo - mf: Database"><input id="aMuda" placeholder="Muda - mf: 8:00-10:00"><input id="aStart" type="number" placeholder="Saa - mf: 8"><input id="aChumba" placeholder="Chumba - mf: Lab 2">
<button class="btn" style="background:#0a3d62;color:white" onclick="addR()">+ Ongeza Kipindi</button><hr>
<input id="aMName" placeholder="Jina la Mwalimu"><input id="aMSomo" placeholder="Somo"><input id="aMPhone" placeholder="Namba - 0712345678">
<button class="btn" style="background:#2980b9;color:white" onclick="addM()">+ Ongeza Mwalimu</button>
</div>
<button onclick="toka()" style="background:rgba(255,255,255,0.3);color:white;border:none;padding:8px 15px;border-radius:20px;margin:auto;display:block">Toka</button>
<audio id="snd" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
</div>

<script>
let EXAM = new Date("2026-12-15T08:00:00");
let RATIBA = JSON.parse(localStorage.getItem('R')||'{"1":[{"somo":"Database Lab","muda":"8:00-10:00","startH":8,"chumba":"Lab 2"}],"2":[{"somo":"Calculus","muda":"10:00-12:00","startH":10,"chumba":"LH 3"}],"3":[{"somo":"Networking","muda":"8:00-10:00","startH":8,"chumba":"Lab 1"}],"4":[{"somo":"System Analysis","muda":"9:00-11:00","startH":9,"chumba":"LH 2"}],"5":[],"0":[],"6":[]}');
let WALIMU = JSON.parse(localStorage.getItem('W')||'[{"name":"Mr. Juma","somo":"Database","phone":"0712345678"},{"name":"HOD","somo":"All","phone":"0711223344"}]');
let SIKU=["Jumapili","Jumatatu","Jumanne","Jumatano","Alhamisi","Ijumaa","Jumamosi"];
function ingia(){let n=document.getElementById('name').value; let p=document.getElementById('pass').value; if(n.length<2){alert("Weka jina");return;} localStorage.setItem('N',n); localStorage.setItem('P',p); openMain();}
function openMain(){let n=localStorage.getItem('N'); if(!n){return;} document.getElementById('login').classList.add('hidden'); document.getElementById('main').classList.remove('hidden'); document.getElementById('hi').innerText="Habari, "+n+"!"; if(localStorage.getItem('P')=="1234"){document.getElementById('b5').classList.remove('hidden');} let d=new Date(); document.getElementById('leo').innerText="Leo ni "+SIKU[d.getDay()]+" - "+d.toLocaleDateString('sw-TZ'); updCount(); renderR(); renderW(); loadAll(); setInterval(updCount,60000); setInterval(checkA,60000);}
function updCount(){let diff=EXAM-new Date(); let days=Math.ceil(diff/86400000); if(days<0)days=0; document.getElementById('count').innerText="Siku "+days+" hadi Mtihani";}
function tab(t){["Ratiba","Tangazo","Lib","Walimu","Admin"].forEach(x=>{document.getElementById("t"+x).classList.add('hidden'); let b=document.getElementById("b"+["Ratiba","Tangazo","Lib","Walimu","Admin"].indexOf(x)+1); if(b) b.classList.remove('active');}); document.getElementById("t"+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');}
function renderR(){let day=new Date().getDay(); let list=RATIBA[day]||[]; let h=""; if(list.length==0)h="<p style='text-align:center;color:#888'>😴 Hakuna vipindi leo</p>"; else list.forEach((r,i)=>{h+=`<div class="item"><b>${r.somo}</b><br><small>${r.muda} | ${r.chumba}</small> ${localStorage.getItem('P')=="1234"?`<button onclick="delR(${day},${i})" style="float:right;background:red;color:white;border:none;padding:3px 8px;border-radius:5px;font-size:10px">Futa</button>`:''}</div>`}); document.getElementById('listRatiba').innerHTML=h;}
function renderW(){let h=""; WALIMU.forEach((w,i)=>{h+=`<div class="item" style="border-left-color:#2980b9;background:#eaf2f8"><b>${w.name}</b> - ${w.somo}<br><small>📞 ${w.phone}</small> <a href="tel:${w.phone}" style="background:#27ae60;color:white;padding:5px 10px;border-radius:5px;text-decoration:none;float:right">Piga</a></div>`}); document.getElementById('listWalimu').innerHTML=h;}
function addR(){let d=document.getElementById('aDay').value; let s=document.getElementById('aSomo').value; let m=document.getElementById('aMuda').value; let sh=parseInt(document.getElementById('aStart').value); let c=document.getElementById('aChumba').value; if(!s||!m||!c||isNaN(sh)){alert("Jaza vyote");return;} if(!RATIBA[d])RATIBA[d]=[]; RATIBA[d].push({somo:s,muda:m,startH:sh,chumba:c}); localStorage.setItem('R',JSON.stringify(RATIBA)); renderR(); alert("Imeongezwa!");}
function addM(){let n=document.getElementById('aMName').value; let s=document.getElementById('aMSomo').value; let p=document.getElementById('aMPhone').value; if(!n||!s||!p){alert("Jaza");return;} WALIMU.push({name:n,somo:s,phone:p}); localStorage.setItem('W',JSON.stringify(WALIMU)); renderW(); alert("Mwalimu ameongezwa");}
function delR(d,i){if(confirm("Futa?")){RATIBA[d].splice(i,1); localStorage.setItem('R',JSON.stringify(RATIBA)); renderR();}}
function addT(){let t=document.getElementById('tTitle').value; let b=document.getElementById('tBody').value; if(!t||!b){alert("Jaza");return;} let arr=JSON.parse(localStorage.getItem('TT')||'[]'); arr.unshift({t,b,n:localStorage.getItem('N')}); localStorage.setItem('TT',JSON.stringify(arr)); loadAll(); document.getElementById('tTitle').value=''; document.getElementById('tBody').value='';}
function addL(){let t=document.getElementById('lTitle').value; let l=document.getElementById('lLink').value; if(!t||!l){alert("Jaza");return;} let arr=JSON.parse(localStorage.getItem('LL')||'[]'); arr.unshift({t,l}); localStorage.setItem('LL',JSON.stringify(arr)); loadAll(); document.getElementById('lTitle').value=''; document.getElementById('lLink').value='';}
function loadAll(){let tt=JSON.parse(localStorage.getItem('TT')||'[]'); let ht=""; tt.forEach(o=>{ht+=`<div class="item" style="border-left-color:#e74c3c;background:#fdedec"><b>${o.t}</b><br><small>${o.b} - ${o.n}</small></div>`}); if(ht)document.getElementById('listTangazo').innerHTML=ht; let ll=JSON.parse(localStorage.getItem('LL')||'[]'); let hl=""; ll.forEach(o=>{hl+=`<div class="item" style="border-left-color:#8e44ad;background:#f5eef8"><b>${o.t}</b> <button onclick="window.open('${o.l}')" style="float:right;background:#8e44ad;color:white;border:none;padding:5px 10px;border-radius:5px">Soma</button></div>`}); if(hl)document.getElementById('listLib').innerHTML=hl;}
function washaAlarm(){Notification.requestPermission().then(p=>{if(p=="granted"){localStorage.setItem('AL','on'); document.getElementById('aOn').classList.remove('hidden'); alert("Alarm ON - Saa 1 kabla");}});}
function checkA(){if(localStorage.getItem('AL')!='on')return; let now=new Date(); let d=now.getDay(); let h=now.getHours(); let m=now.getMinutes(); (RATIBA[d]||[]).forEach(r=>{if(r.startH-1==h && m==0){let k='N'+now.toDateString()+r.somo; if(localStorage.getItem(k))return; localStorage.setItem(k,'1'); document.getElementById('snd').play(); new Notification("Jiandae! "+r.somo,{body:r.muda+" "+r.chumba});}});}
function nipo(){localStorage.setItem('NIPO'+new Date().toDateString(),'1'); document.getElementById('nipoMsg').innerText="✅ Upo darasani leo!";}
function toka(){localStorage.removeItem('N'); location.reload();}
openMain();
</script>
</body>
</html>
