<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Class Assistant</title>
<style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; background: #f2f4f7; padding: 15px; }
  .container { max-width: 700px; margin: auto; }
  .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .countdown { background: #1a73e8; color: white; text-align: center; }
  .countdown h3 { margin: 0; font-size: 14px; }
  .countdown h1 { font-size: 42px; margin: 5px 0; }
  .countdown p { margin: 0; font-size: 14px; }
  .timetable-item { border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .timetable-item b { font-size: 16px; }
  .timetable-item span { font-size: 13px; color: #555; }
  .time-badge { background: #1a73e8; color: white; padding: 6px 10px; border-radius: 8px; font-weight: bold; min-width: 60px; text-align: center; }
  .btn { display: inline-block; background: #1a73e8; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; margin-right: 8px; margin-top: 5px; }
  .btn-green { background: #2e7d32; }
  input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">

  <h2 style="text-align:center;">🎓 SMART CLASS ASSISTANT</h2>
  <p style="text-align:center; color:#555;">Level 5 IT - Ratiba + Mtihani + Library + Mahudhurio</p>

  <!-- 1. COUNTDOWN - IMERUDISHWA -->
  <div class="card countdown" id="countdown-box">
    <h3>MTIHANI UNABAKI</h3>
    <h1 id="countdown-days">...</h1>
    <p id="countdown-msg">Inapakia...</p>
    <p id="countdown-date" style="font-size:12px; opacity:0.9; margin-top:5px;"></p>
  </div>

  <!-- 2. RATIBA YA LEO - INABADILIKA KILA SIKU -->
  <div class="card">
    <h3 id="timetable-title">Ratiba ya Leo</h3>
    <p id="timetable-date" style="color:#555; font-size:13px;"></p>
    <div id="timetable-list"></div>
    <hr>
    <p style="font-size:13px; color:#555;">Chagua siku nyingine kuiona:</p>
    <select id="siku-chagua" onchange="showTimetableByDay(this.value)">
      <option value="auto">-- Leo (Otomatiki) --</option>
      <option value="Jumatatu">Jumatatu</option>
      <option value="Jumanne">Jumanne</option>
      <option value="Jumatano">Jumatano</option>
      <option value="Alhamisi">Alhamisi</option>
      <option value="Ijumaa">Ijumaa</option>
      <option value="Jumamosi">Jumamosi</option>
      <option value="Jumapili">Jumapili</option>
    </select>
  </div>

  <!-- 3. E-LIBRARY - IMEBAKI -->
  <div class="card">
    <h3>📚 E-Library</h3>
    <p>Notes na Past Papers mahali pamoja.</p>
    <a class="btn" href="#">Database Notes PDF</a>
    <a class="btn" href="#">Past Paper 2024</a>
    <a class="btn btn-green" href="#">Upload Note</a>
  </div>

  <!-- 4. MAHUDHURIO - IMEBAKI -->
  <div class="card">
    <h3>✅ Mahudhurio ya Leo</h3>
    <input type="text" id="jina" placeholder="Jina la mwanafunzi">
    <select id="somo-mahudhurio">
      <option>Database</option>
      <option>Web Development</option>
      <option>Networking</option>
      <option>Programming</option>
    </select>
    <button onclick="wekaMahudhurio()">Weka Mahudhurio</button>
    <div id="mahudhurio-list" style="margin-top:10px;"></div>
    <p id="mahudhurio-count" style="font-weight:bold;"></p>
  </div>

</div>

<script>
// ====================================================
// SEHEMU A: TAREHE YA MTIHANI - BADILISHA HAPA TU
// ====================================================
const TAREHE_YA_MTIHANI = "2026-12-15"; // Badilisha: mfano "2026-11-20"

// ====================================================
// SEHEMU B: RATIBA YA WIKI - BADILISHA HAPA MASOMO YENU
// ====================================================
const TIMETABLE = {
  "Jumatatu": [
    { time: "08:00", subject: "Database", room: "Room 5", teacher: "Mr. John" },
    { time: "10:30", subject: "Web Development", room: "Lab 2", teacher: "Madam Anna" },
    { time: "14:00", subject: "Networking", room: "Room 5", teacher: "Mr. Peter" }
  ],
  "Jumanne": [
    { time: "08:00", subject: "Database", room: "Room 5", teacher: "Mr. John" },
    { time: "11:00", subject: "System Analysis", room: "Room 3", teacher: "Madam Sara" }
  ],
  "Jumatano": [
    { time: "09:00", subject: "Programming", room: "Lab 1", teacher: "Mr. David" },
    { time: "13:00", subject: "English", room: "Room 5", teacher: "Madam Grace" }
  ],
  "Alhamisi": [
    { time: "08:00", subject: "Networking", room: "Room 5", teacher: "Mr. Peter" },
    { time: "10:00", subject: "Database Practical", room: "Lab 2", teacher: "Mr. John" },
    { time: "14:30", subject: "Entrepreneurship", room: "Room 3", teacher: "Madam Anna" }
  ],
  "Ijumaa": [
    { time: "08:30", subject: "Web Development", room: "Lab 2", teacher: "Madam Anna" },
    { time: "11:00", subject: "Project", room: "Room 5", teacher: "Mr. David" }
  ],
  "Jumamosi": [],
  "Jumapili": []
};

// ====================================================
// SEHEMU C: COUNTDOWN - USIGUSE
// ====================================================
function updateCountdown() {
  const leo = new Date(); leo.setHours(0,0,0,0);
  const mtihani = new Date(TAREHE_YA_MTIHANI); mtihani.setHours(0,0,0,0);
  const siku = Math.ceil((mtihani - leo) / (1000*60*60*24));

  const daysEl = document.getElementById("countdown-days");
  const msgEl = document.getElementById("countdown-msg");
  const boxEl = document.getElementById("countdown-box");
  const dateEl = document.getElementById("countdown-date");
  dateEl.textContent = "Tarehe ya Mtihani: " + TAREHE_YA_MTIHANI;

  if (siku > 0) {
    daysEl.textContent = siku + " SIKU";
    msgEl.textContent = "Soma leo, muda unakwenda!";
    if (siku <= 7) { boxEl.style.background = "#d32f2f"; msgEl.textContent = "Hatari! Zimebaki siku " + siku + " tu!"; }
    else if (siku <= 30) { boxEl.style.background = "#ff9800"; }
    else { boxEl.style.background = "#1a73e8"; }
  } else if (siku === 0) {
    daysEl.textContent = "LEO!"; msgEl.textContent = "Mtihani ni leo. Kila la heri!"; boxEl.style.background = "#d32f2f";
  } else {
    daysEl.textContent = "IMESHAFIKA"; msgEl.textContent = "Mtihani umeshapita. Weka tarehe mpya.";
  }
}

// ====================================================
// SEHEMU D: RATIBA INABADILIKA KILA SIKU + INAJIPANGA KWA MUDA
// ====================================================
function mudaKwaDakika(time) {
  const parts = time.split(":");
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function onyeshaRatiba(jinaLaSiku) {
  const title = document.getElementById("timetable-title");
  const list = document.getElementById("timetable-list");
  const dateEl = document.getElementById("timetable-date");

  title.textContent = "Ratiba ya " + jinaLaSiku;
  dateEl.textContent = "Leo ni " + new Date().toLocaleDateString("sw-TZ", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  let vipindi = TIMETABLE[jinaLaSiku] || [];

  if (vipindi.length === 0) {
    list.innerHTML = "<p>Leo hakuna vipindi. Pumzika au soma notes.</p>";
    return;
  }

  // HAPA NDIPO VINAJIPANGA KWA MUDA - hata kama ni 5, vinapangika
  vipindi = [...vipindi].sort((a,b) => mudaKwaDakika(a.time) - mudaKwaDakika(b.time));

  list.innerHTML = vipindi.map(v => `
    <div class="timetable-item">
      <div><b>${v.subject}</b><br><span>${v.room} | ${v.teacher}</span></div>
      <div class="time-badge">${v.time}</div>
    </div>
  `).join("");
}

function showTimetableByDay(chaguo) {
  if (chaguo === "auto") {
    const sikuZaWiki = ["Jumapili","Jumatatu","Jumanne","Jumatano","Alhamisi","Ijumaa","Jumamosi"];
    onyeshaRatiba(sikuZaWiki[new Date().getDay()]);
  } else {
    onyeshaRatiba(chaguo);
  }
}

// ====================================================
// SEHEMU E: MAHUDHURIO RAHISI - IMEBAKI
// ====================================================
let mahudhurio = JSON.parse(localStorage.getItem("mahudhurio") || "[]");
function wekaMahudhurio() {
  const jina = document.getElementById("jina").value.trim();
  const somo = document.getElementById("somo-mahudhurio").value;
  if (!jina) { alert("Andika jina kwanza"); return; }
  mahudhurio.push({ jina, somo, tarehe: new Date().toLocaleDateString() });
  localStorage.setItem("mahudhurio", JSON.stringify(mahudhurio));
  document.getElementById("jina").value = "";
  onyeshaMahudhurio();
}
function onyeshaMahudhurio() {
  const list = document.getElementById("mahudhurio-list");
  const count = document.getElementById("mahudhurio-count");
  list.innerHTML = mahudhurio.map(m => `<div>✅ ${m.jina} - ${m.somo} - ${m.tarehe}</div>`).join("");
  count.textContent = "Wamehudhuria leo: " + mahudhurio.length;
}

// ANZA KAZI
updateCountdown();
showTimetableByDay("auto");
onyeshaMahudhurio();
</script>
</body>
</html>
