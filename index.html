<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART CLASS V16</title>
<style>
body{background:#0a3d62;margin:0;padding:12px;font-family:Arial}
.card{background:white;border-radius:15px;padding:18px;margin-bottom:10px}
.btn{background:#f1c40f;color:#0a3d62;border:none;padding:13px;width:100%;border-radius:10px;font-weight:bold}
input{width:93%;padding:11px;margin:5px 0;border-radius:8px;border:2px solid #ddd}
.hidden{display:none}
.nav{display:flex;gap:5px;margin:8px 0;overflow:auto}
.nav button{padding:8px 12px;border-radius:20px;border:none;background:white;font-weight:bold;white-space:nowrap}
.nav button.active{background:#f1c40f}
.item{border-left:5px solid #27ae60;background:#eafaf1;padding:10px;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<script>
// ===== EDIT HAPA TU =====
const RATIBA_YANGU = {
  1: [ {somo:"Database Lab", muda:"8:00-10:00", startH:8, chumba:"Lab 2"}, {somo:"English", muda:"11:00-13:00", startH:11, chumba:"LH 1"} ],
  2: [ {somo:"Calculus", muda:"10:00-12:00", startH:10, chumba:"LH 3"} ],
  3: [ {somo:"Networking", muda:"8:00-10:00", startH:8, chumba:"Lab 1"} ],
  4: [ {somo:"System Analysis", muda:"9:00-11:00", startH:9, chumba:"LH 2"} ],
  5: [ {somo:"Project", muda:"8:00-12:00", startH:8, chumba:"Lab 1"} ],
  0: [], 6: []
};
const WALIMU_WANGU = [
  {name:"Mr. Juma - Database", somo:"Database", phone:"0712345678"},
  {name:"HOD - BIT", somo:"Mkuu wa Idara", phone:"0711223344"}
];
const VITABU_VYANGU = [
  {title:"📘 Database Notes", link:"https://www.w3schools.com/sql/"},
  {title:"📗 Networking Slides", link:"https://www.geeksforgeeks.org/computer-network-tutorials/"}
];
const TANGAZO_LANGU = [
  {title:"🚨 MUHIMU - LEO SAA 4 USIKU!", body:"Wanafunzi wote mnabidi muwe online leo saa 4 usiku (10:00 PM) kwenye Smart Class. Kikao muhimu na HOD. Msiikose! - CR Godfrey"},
  {title:"🔥 Mtihani wa Communication", body:"Jumatatu 22/09/2026 - Lab 1"},
  {title:"📝 Assignment Networking", body:"Mwisho Ijumaa hii"}
];
const TAREHE_MTIHANI = "2026-12-15T08:00:00";
</script>

<div id="login" class="card" style="margin-top:40px;text-align:center">
<h2>🎓 SMART CLASS</h2>
<input id="name" placeholder="Jina lako">
<input id="pass" type="password" placeholder="Password - 0000">
<button class="btn" onclick="ingia()">INGIA →</button>
<p style="font-size:10px;color:#888">Wanafunzi 0000 | CR 1234</p>
</div>

<div id="main" class="hidden">
<div class="card" style="background:linear-gradient(135deg,#0a3d62,#f1c40f);color:white;text-align:center">
<h2 id="hi" style="margin:0"></h2>
<p id="leo" style="font-size:11px"></p>
<h1 id="count" style="color:#f1c40f;margin:5px 0"></h1>
</div>
<div class="nav">
<button id="b1" class="active" onclick="tab('ratiba')">📅 Ratiba</button>
<button id="b2" onclick="tab('tangazo')">📢 Tangazo</button>
<button id="b3" onclick="tab('lib')">📚 Library</button>
<button id="b4" onclick="tab('walimu')">👨‍🏫 Walimu</button>
<button id="b5" class="hidden" onclick="tab('admin')">⚙️ EDIT</button>
</div>
<div id="tRatiba" class="card"><h3>📅 Vipindi Vya Leo</h3><div id="listRatiba"></div></div>
<div id="tTangazo" class="card hidden"><h3>📢 Matangazo</h3><div id="listTangazo"></div></div>
<div id="tLib" class="card hidden"><h3>📚 Library</h3><div id="listLib"></div></div>
<div id="tWalimu" class="card hidden"><h3>👨‍🏫 Walimu</h3><div id="listWalimu"></div></div>
<div id="tAdmin" class="card hidden" style="border:3px solid #f1c40f"><h3>⚙️ EDIT - Godfrey Tu!</h3><p style="font-size:12px">Edit juu kwenye EDIT HAPA TU kisha Commit!</p></div>
<button onclick="toka()" style="background:rgba(255,255,255,0.3);color:white;border:none;padding:6px 12px;border-radius:20px;margin:auto;display:block;font-size:11px">Toka</button>
</div>

<script>
let RATIBA = RATIBA_YANGU; let WALIMU = WALIMU_WANGU;
let SIKU=["Jumapili","Jumatatu","Jumanne","Jumatano","Alhamisi","Ijumaa","Jumamosi"];
let EXAM = new Date(TAREHE_MTIHANI);
function ingia(){let n=document.getElementById('name').value.trim(); let p=document.getElementById('pass').value.trim(); if(n.length<2){alert("Weka jina");return;} localStorage.setItem('N',n); localStorage.setItem('P',p); openMain();}
function openMain(){let n=localStorage.getItem('N'); let p=localStorage.getItem('P'); if(!n) return; document.getElementById('login').classList.add('hidden'); document.getElementById('main').classList.remove('hidden'); document.getElementById('hi').innerText="Habari, "+n+"!"; if(n.toLowerCase().includes("godfrey") && p=="1234"){document.getElementById('b5').classList.remove('hidden');} document.getElementById('leo').innerText="Leo ni "+SIKU[new Date().getDay()]; let diff=EXAM-new Date(); let days=Math.ceil(diff/86400000); if(days<0)days=0; document.getElementById('count').innerText="Siku "+days+" hadi Mtihani"; renderAll();}
function renderAll(){let day=new Date().getDay(); let list=RATIBA[day]||[]; let h=""; if(list.length==0)h="<p style='text-align:center;color:#888'>😴 Hakuna vipindi leo</p>"; else list.forEach(r=>{h+=`<div class="item"><b>${r.somo}</b><br><small>⏰ ${r.muda} | 📍 ${r.chumba}</small></div>`}); document.getElementById('listRatiba').innerHTML=h; let ht=""; TANGAZO_LANGU.forEach(t=>{let col=t.title.includes("MUHIMU")?"#c0392b":"#e74c3c"; let bg=t.title.includes("MUHIMU")?"#f9ebea":"#fdedec"; ht+=`<div class="item" style="border-left-color:${col};background:${bg}"><b>${t.title}</b><br><small>${t.body}</small></div>`}); document.getElementById('listTangazo').innerHTML=ht; let hl=""; VITABU_VYANGU.forEach(v=>{hl+=`<div class="item" style="border-left-color:#8e44ad;background:#f5eef8"><b>${v.title}</b> <button onclick="window.open('${v.link}')" style="float:right;background:#8e44ad;color:white;border:none;padding:5px 10px;border-radius:5px">Soma</button></div>`}); document.getElementById('listLib').innerHTML=hl; let hw=""; WALIMU_WANGU.forEach(w=>{hw+=`<div class="item" style="border-left-color:#2980b9;background:#eaf2f8"><b>${w.name}</b> - ${w.somo}<br><small>📞 ${w.phone}</small> <a href="tel:${w.phone}" style="background:#27ae60;color:white;padding:5px 10px;border-radius:5px;text-decoration:none;float:right">Piga</a></div>`}); document.getElementById('listWalimu').innerHTML=hw;}
function tab(t){["Ratiba","Tangazo","Lib","Walimu","Admin"].forEach(x=>{document.getElementById("t"+x).classList.add('hidden');}); document.getElementById("t"+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');}
function toka(){localStorage.removeItem('N'); location.reload();}
openMain();
</script>
</body>
</html>
