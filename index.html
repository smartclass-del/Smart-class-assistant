<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahudhurio - Smart Class</title>
<style>
body{font-family:Arial; padding:15px; background:#f2f2f2;}
input, select{width:100%; padding:12px; margin:5px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
button{width:100%; padding:14px; border:none; border-radius:8px; background:#2563eb; color:white; font-weight:bold; font-size:16px;}
button:disabled{background:#999;}
table{width:100%; background:white; border-collapse:collapse; margin-top:15px;}
th,td{padding:8px; border:1px solid #ddd; font-size:13px;}
#ujumbe{padding:12px; border-radius:8px; margin-top:10px; display:none; font-weight:bold; text-align:center;}
</style>
</head>
<body>
<h2>Mahudhurio - Smart Class</h2>
<input type="text" id="jina" placeholder="Jina lako kamili">
<input type="text" id="namba" placeholder="Namba mf: IT/01">
<select id="somo">
  <option>Database</option>
  <option>Networking</option>
  <option>Web Development</option>
  <option>Programming</option>
</select>
<input type="date" id="tarehe">
<div id="ujumbe"></div>
<button id="btnIngia" onclick="ingia()">NIMESHAFIKA ✅</button>

<h3>Walioshaingia Leo (Live) - CR anaona hapa</h3>
<p id="hesabu">Inapakia...</p>
<table>
<thead><tr><th>Jina</th><th>Namba</th><th>Somo</th><th>Muda</th></tr></thead>
<tbody id="orodha"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDIKEsqM75pt5idkqIAjVzOy_sR5E-0I3A",
  authDomain: "smart-class-cfe45.firebaseapp.com",
  projectId: "smart-class-cfe45",
  storageBucket: "smart-class-cfe45.firebasestorage.app",
  messagingSenderId: "951101986882",
  appId: "1:951101986882:web:24f6b609e3113b8f4675db",
  measurementId: "G-KF8L9NTLEP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('tarehe').valueAsDate = new Date();

function ujumbe(text, rangi){
  let u = document.getElementById('ujumbe');
  u.style.display='block'; u.style.background=rangi; u.style.color='white'; u.innerText=text;
  setTimeout(()=> u.style.display='none', 4000);
}

window.ingia = async function(){
  let btn = document.getElementById('btnIngia');
  btn.disabled = true;
  btn.innerText = 'Inatuma...';
  try{
    let jina = document.getElementById('jina').value.trim();
    let namba = document.getElementById('namba').value.trim().toUpperCase();
    let somo = document.getElementById('somo').value;
    let tarehe = document.getElementById('tarehe').value;
    if(!jina || !namba || !tarehe){ ujumbe('⚠️ Weka Jina, Namba na Tarehe','orange'); return; }

    const snap = await getDocs(collection(db, "mahudhurio"));
    let tayari = false;
    snap.forEach(doc => {
      let d = doc.data();
      if(d.namba === namba && d.somo === somo && d.tarehe === tarehe) tayari = true;
    });
    if(tayari){ ujumbe('⛔ ' + jina + ' TAYARI UMEINGIA LEO!','red'); return; }

    await addDoc(collection(db, "mahudhurio"), {
      jina, namba, somo, tarehe, muda: new Date().toLocaleTimeString(), created: Date.now()
    });
    ujumbe('✅ Karibu ' + jina + ', umehesabiwa!','green');
    document.getElementById('jina').value='';
    document.getElementById('namba').value='';
  }catch(e){
    ujumbe('❌ Hitilafu: ' + e.message,'red');
    console.log(e);
  }finally{
    btn.disabled = false;
    btn.innerText = 'NIMESHAFIKA ✅';
  }
}

onSnapshot(collection(db, "mahudhurio"), (snap)=>{
  let rows = [];
  snap.forEach(doc => rows.push(doc.data()));
  rows.sort((a,b)=> b.created - a.created);
  let tbody = document.getElementById('orodha');
  tbody.innerHTML = '';
  rows.forEach(d => {
    tbody.innerHTML += `<tr><td>${d.jina}</td><td>${d.namba}</td><td>${d.somo}</td><td>${d.muda}</td></tr>`;
  });
  document.getElementById('hesabu').innerText = 'Jumla walioingia: ' + rows.length;
});
</script>
</body>
</html>
