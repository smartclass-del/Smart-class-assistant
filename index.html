<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART CLASS V3 - Alarm & Countdown</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#0a3d62;color:white;padding:15px;border-radius:12px;text-align:center;position:sticky;top:0;z-index:10}
.card{background:white;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.btn{background:#0a3d62;color:white;padding:12px;border:none;border-radius:8px;width:100%;margin-top:10px;font-weight:bold}
input{width:95%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
.hidden{display:none}
.today-class{border-left:5px solid #27ae60;background:#eafaf1}
.alarm-on{background:#fff3cd;border:1px solid #ffc107;padding:10px;border-radius:8px;font-size:13px}
.countdown{font-size:28px;font-weight:bold;color:#c0392b;text-align:center}
</style>
</head>
<body>

<div id="loginPage" class="card">
<h2 style="text-align:center">SMART CLASS V3</h2>
<p style="text-align:center;font-size:13px">Ingia uone ratiba ya leo na alarm</p>
<input id="regName" placeholder="Jina Kamili">
<input id="regPass" type="password" placeholder="Password">
<button class="btn" onclick="register()">JISAJILI / INGIA</button>
</div>

<div id="mainPage" class="hidden">
<div class="header">
<h2 id="welcomeText">Habari!</h2>
<p id="todayDate"></p>
<div class="countdown" id="examCountdown">Siku 89 hadi Mtihani</div>
<p style="font-size:11px">Mtihani wa Mwisho: Dec 15, 2026 - 8:00 AM</p>
<button onclick="enableAlarm()" id="alarmBtn" class="hidden" style="background:#ffc107;color:black;border:none;padding:6px 12px;border-radius:20px;font-size:11px;margin-top:8px">🔔 Wezesha Alarm ya Masomo</button>
<button onclick="logout()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:5px 10px;border-radius:5px;font-size:11px;margin-left:10px">Toka</button>
</div>

<div id="alarmStatus" class="card alarm-on hidden">
🔔 <b>Alarm Iko ON:</b> Utapata kelele <b>saa 1 kabla</b> ya kila kipindi chako cha leo. Usifunge tab hii.
</div>

<div class="card" id="todayCard">
<h3 id="todayTitle">Vipindi Vya Leo</h3>
<div id="todayList"></div>
<button class="btn" onclick="markNipo()">NIPO DARASANI LEO ✅</button>
<p id="nipoMsg" style="text-align:center;color:green;font-weight:bold"></p>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
</div>

<script>
const EXAM_DATE = new Date("2026-12-15T08:00:00"); // BADILISHA TAREHE HALISI HAPA
const ratiba = {
0: [], // Jumapili - hakuna
1: [{somo:"Database Lab",muda:"8:00-10:00",startH:8,chumba:"Lab 2"}, {somo:"English",muda:"11:00-13:00",startH:11,chumba:"LH 1"}],
2: [{somo:"Calculus",muda:"10:00-12:00",startH:10,chumba:"LH 3"}],
3: [{somo:"Networking",muda:"8:00-10:00",startH:8,chumba:"Lab 1"}, {somo:"Programming",muda:"14:00-16:00",startH:14,chumba:"Lab 2"}],
4: [{somo:"System Analysis",muda:"9:00-11:00",startH:9,chumba:"LH 2"}],
5: [{somo:"MTIHANI WA MWISHO",muda:"8:00 AM",startH:8,chumba:"Hall A"}],
6: []
};
const siku = ["Jumapili","Jumatatu","Jumanne","Jumatano","Alhamisi","Ijumaa","Jumamosi"];

function register(){let n=document.getElementById('regName').value; if(n.length<3){alert("Weka jina");return;} localStorage.setItem('sc_name',n); showMain();}
function showMain(){
let name=localStorage.getItem('sc_name'); if(!name) return;
document.getElementById('loginPage').classList.add('hidden'); document.getElementById('mainPage').classList.remove('hidden');
document.getElementById('welcomeText').innerText="Habari, "+name+"!";
let leo=new Date(); document.getElementById('todayDate').innerText="Leo ni "+siku[leo.getDay()]+" - "+leo.toLocaleDateString('sw-TZ');
updateCountdown(); setInterval(updateCountdown, 60000); // update kila dakika
renderToday(); checkAlarmPermission(); setInterval(checkAlarm, 60000); // angalia alarm kila dakika
}
function updateCountdown(){
let now=new Date(); let diff=EXAM_DATE - now; let days=Math.ceil(diff/(1000*60*60*24));
if(days<0) days=0; document.getElementById('examCountdown').innerText="Siku "+days+" hadi Mtihani";
if(now.getHours()===18 && now.getMinutes()===0){ renderToday(); } // saa 6 usiku badilisha kila kitu
}
function renderToday(){
let leo=new Date(); let num=leo.getDay(); let list=ratiba[num]||[];
document.getElementById('todayTitle').innerText="Vipindi vya Leo - "+siku[num]+" ("+list.length+")";
let html=""; if(list.length===0){html="<p>Hakuna vipindi leo. Pumzika au soma mtihani!</p>"}
else{list.forEach(r=>{html+=`<div class="card today-class"><b>${r.somo}</b><br><small>${r.muda} | ${r.chumba}</small></div>`});}
document.getElementById('todayList').innerHTML=html;
}
function enableAlarm(){ Notification.requestPermission().then(p=>{if(p==="granted"){localStorage.setItem('sc_alarm','on'); document.getElementById('alarmStatus').classList.remove('hidden'); alert("Alarm imewezeshwa! Utapata notification saa 1 kabla ya kipindi."); checkAlarm();}});}
function checkAlarmPermission(){if(localStorage.getItem('sc_alarm')==='on' && Notification.permission==='granted'){document.getElementById('alarmStatus').classList.remove('hidden'); document.getElementById('alarmBtn').classList.add('hidden');} else {document.getElementById('alarmBtn').classList.remove('hidden');}}
function checkAlarm(){
if(localStorage.getItem('sc_alarm')!=='on' || Notification.permission!=='granted') return;
let now=new Date(); let num=now.getDay(); let currentH=now.getHours(); let currentM=now.getMinutes();
(ratiba[num]||[]).forEach(r=>{
if(r.startH -1 === currentH && currentM===0){ // saa 1 kabla
let key='notified_'+now.toDateString()+'_'+r.somo; if(localStorage.getItem(key)) return;
localStorage.setItem(key,'1');
document.getElementById('alarmSound').play();
new Notification("🔔 SMART CLASS - Jiandae!", {body:`${r.somo} inaanza saa ${r.muda} chumba ${r.chumba}. Jiandae sasa!`, icon:"https://cdn-icons-png.flaticon.com/512/3652/3652191.png"});
}
});
}
function markNipo(){let name=localStorage.getItem('sc_name'); let todayStr=new Date().toDateString(); localStorage.setItem('sc_last_'+name,todayStr); document.getElementById('nipoMsg').innerText="Upo darasani leo ✅";}
function logout(){localStorage.removeItem('sc_name'); location.reload();}
showMain();
</script>
</body>
</html>
